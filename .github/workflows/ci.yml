name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Jobs only read the repository. Nothing here writes to it or needs a secret.
permissions:
  contents: read

concurrency:
  # One run per PR (per ref on pushes). A newer push to a PR cancels the superseded run; runs on main are never
  # cancelled, so every merged commit gets a complete result.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (the comment names the release); Dependabot keeps them current.
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the python3 that alpine:3.24 (production) ships; 3.15 is the current stable release.
        # When production moves to a new Alpine release, update the first entry along with the alpine job.
        python-version: ["3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify SQLite FTS5 support
        run: |
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('create virtual table t using fts5(x)')"

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Verify zero skipped JWT tests
        run: |
          output=$(python -m pytest -q -rs tests/test_app.py tests/test_lan_security.py -k "jwt or cloudflare")
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "Error: JWT/Cloudflare authentication tests were skipped!" >&2
            exit 1
          fi
          if ! echo "$output" | grep -q "passed"; then
            echo "Error: Expected JWT/Cloudflare tests to run and pass!" >&2
            exit 1
          fi

      - name: Syntax-check shell scripts
        run: |
          # one file per `sh -n`: given several arguments it parses only the first and treats the rest as arguments
          for f in installer/build.sh installer/setup-head.sh ops/* .github/scripts/*.sh; do
            echo "sh -n $f"
            sh -n "$f"
          done

  alpine:
    name: alpine smoke test (alpine:${{ matrix.alpine }})
    runs-on: ubuntu-latest
    container: alpine:${{ matrix.alpine }}
    strategy:
      fail-fast: false
      matrix:
        # 3.24 is the release production runs (keep it in step with the server). `latest` is the next upgrade:
        # it shows apk package changes before they reach production.
        alpine: ["3.24", "latest"]

    steps:
      - name: Install git in container
        run: |
          apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step A — Native Alpine apk test run
      - name: Step A - Install native Alpine packages
        run: |
          apk add --no-cache python3 py3-flask py3-gunicorn py3-pillow py3-jwt py3-cryptography py3-pytest sqlite

      - name: Step A - Verify SQLite FTS5 in Alpine Python
        run: |
          python3 -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('create virtual table t using fts5(x)')"

      - name: Step A - Run test suite against system Python
        run: |
          pytest -q

      # Step B — End-to-end installer smoke test
      - name: Step B - Install installer prerequisites
        run: |
          apk add --no-cache tar iproute2 curl

      - name: Step B - Install OpenRC container stubs
        run: |
          sh .github/scripts/install-openrc-stub.sh

      - name: Step B - Build installer
        run: |
          sh installer/build.sh

      - name: Step B - Run installer
        run: |
          sh dist/setup-cookbooks.sh

      - name: Step B - Verify permissions
        run: |
          test -d /opt/cookbooks
          test -d /var/lib/cookbooks
          test "$(stat -c %a /etc/conf.d/cookbooks)" = "640"
          test "$(stat -c %a /etc/conf.d/app-ops)" = "600"
          test "$(stat -c %U /opt/cookbooks)" = "root"
          test "$(stat -c %U /var/lib/cookbooks)" = "cookbooks"
          test "$(stat -c %U:%G /etc/conf.d/cookbooks)" = "root:cookbooks"
          test -x /usr/local/bin/app-restore

      - name: Step B - Verify Gunicorn health endpoint
        run: |
          res=$(wget -qO- http://127.0.0.1:8767/healthz)
          echo "Health response: $res"
          echo "$res" | grep -Eq '"ok": *(true|1)|(^ok$)'

      - name: Step B - Verify /mcp JSON-RPC initialize
        run: |
          http_code=$(curl -s -o /tmp/mcp_init.json -w "%{http_code}" -X POST http://127.0.0.1:8767/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "MCP HTTP status code: $http_code"
          cat /tmp/mcp_init.json
          test "$http_code" = "200"
          grep -q '"jsonrpc": *"2.0"' /tmp/mcp_init.json

      - name: Step B - Verify app-backup creates .db.gz snapshot
        run: |
          /usr/local/bin/app-backup
          snapshot=$(find /var/backups/apps -name "cookbooks-*.db.gz" | head -n1)
          echo "Found snapshot: $snapshot"
          test -n "$snapshot"
          test -f "$snapshot"

      - name: Step B - Verify the image backup warning
        run: |
          count() { grep -c "$1" /var/log/app-ops.log || true; }
          warned=$(count 'backup: WARNING: image files are not backed up')
          alerted=$(count 'Backup coverage down')
          mkdir -p /var/lib/cookbooks/photos
          touch /var/lib/cookbooks/photos/ci-canary.jpg
          /usr/local/bin/app-backup
          /usr/local/bin/app-backup
          # BACKUP_TARGET is empty: the warning is logged every night...
          test "$(count 'backup: WARNING: image files are not backed up')" = "$((warned + 2))"
          # ...but the alert goes out once, when the state begins
          if [ "$alerted" = 0 ]; then test "$(count 'Backup coverage down')" = 1; else test "$(count 'Backup coverage down')" = "$alerted"; fi
          /usr/local/bin/app-backup --check-images | grep -q 'not backed up'
          rm -f /var/lib/cookbooks/photos/ci-canary.jpg
          if /usr/local/bin/app-backup --check-images >/dev/null; then
            echo "Error: --check-images still warns with no image files"; exit 1
          fi

      - name: Step B - Verify log rotation
        run: |
          set -eu
          conf=/etc/logrotate.d/cookbooks
          test -f "$conf"
          test "$(stat -c %a "$conf")" = "644"
          grep -q copytruncate "$conf"
          test -x /etc/periodic/daily/logrotate
          # the config is valid, and a forced rotation through /etc/logrotate.conf works
          logrotate -d "$conf"
          test -s /var/log/cookbooks.log
          logrotate -f /etc/logrotate.conf
          # the rotated copy is cookbooks.log.1, or cookbooks.log-<date> if the distro's config sets dateext
          rotated() { ls "$1".* "$1"-* 2>/dev/null | head -n 1; }
          test -n "$(rotated /var/log/cookbooks.log)"
          # copytruncate: the service keeps writing to the same log without a restart
          wget -qO- http://127.0.0.1:8767/healthz >/dev/null
          sleep 1
          test -s /var/log/cookbooks.log
          test -n "$(rotated /var/log/app-ops.log)"

      - name: Step B - Verify TZ setting and tzdata
        run: |
          grep -q '^TZ=""' /etc/conf.d/cookbooks
          grep -q 'export TZ' /etc/init.d/cookbooks
          test -f /usr/share/zoneinfo/America/Los_Angeles
          # 2026-01-01 00:00 UTC is 16:00 PST on Dec 31 in Los Angeles: libc found the zone file
          out=$(TZ=America/Los_Angeles python3 -c "import time; t=time.localtime(1767225600); print(t.tm_zone, t.tm_hour)")
          echo "$out"
          test "$out" = "PST 16"

      - name: Step B - Verify installer idempotency and pre-upgrade backup
        run: |
          token_before=$(grep '^MCP_TOKEN=' /etc/conf.d/cookbooks)
          # an owner-edited log rotation config must survive an upgrade untouched
          echo "# edited by the owner" >> /etc/logrotate.d/cookbooks
          sh dist/setup-cookbooks.sh
          grep -q '# edited by the owner' /etc/logrotate.d/cookbooks
          test "$(grep -c '^/var/log/cookbooks.log' /etc/logrotate.d/cookbooks)" = 1
          logrotate -d /etc/logrotate.d/cookbooks
          token_after=$(grep '^MCP_TOKEN=' /etc/conf.d/cookbooks)
          test "$token_before" = "$token_after"
          backup=$(find /var/backups/apps -name "cookbooks-before-upgrade-*.db.gz" | head -n1)
          echo "Found pre-upgrade backup: $backup"
          test -n "$backup"
          test -f "$backup"
          wget -qO- http://127.0.0.1:8767/healthz | grep -Eq '"ok": *(true|1)|(^ok$)'

      - name: Step B - Verify backup, change a row, restore with app-restore
        run: |
          set -eu
          DB=/var/lib/cookbooks/cookbooks.db
          # sqlite3 runs as the service user, like the app does: a root-owned -wal/-shm would lock the service out
          q() { su -s /bin/sh cookbooks -c "sqlite3 -cmd '.timeout 30000' $DB \"$1\""; }
          canary() { q "SELECT value FROM meta WHERE key='ci_canary'"; }
          q "INSERT OR REPLACE INTO meta(key, value) VALUES ('ci_canary', 'original')"
          /usr/local/bin/app-backup
          q "UPDATE meta SET value='changed' WHERE key='ci_canary'"
          test "$(canary)" = changed

          /usr/local/bin/app-restore --list
          # a dry run verifies the snapshot and prints the plan, and changes nothing
          /usr/local/bin/app-restore --dry-run latest | tee /tmp/restore-plan.txt
          grep -q 'Dry run' /tmp/restore-plan.txt
          test "$(canary)" = changed
          test -z "$(ls /var/backups/apps/cookbooks-before-restore-*.db.gz 2>/dev/null)"

          /usr/local/bin/app-restore latest
          test "$(canary)" = original
          test "$(q 'PRAGMA integrity_check')" = ok
          # the service is back and healthy, the replaced database was saved, and nothing root-owned is left behind
          rc-service cookbooks status
          wget -qO- http://127.0.0.1:8767/healthz | grep -Eq '"ok": *true'
          ls /var/backups/apps/cookbooks-before-restore-*.db.gz
          test "$(stat -c %U $DB)" = cookbooks
          test -z "$(find /var/lib/cookbooks -maxdepth 1 -name 'cookbooks.db*' ! -user cookbooks)"
          test -z "$(find /var/lib/cookbooks -maxdepth 1 -name '.restore-*')"

      - name: Step B - Verify installer --uninstall
        run: |
          sh dist/setup-cookbooks.sh --uninstall
          test ! -d /opt/cookbooks
          test ! -f /etc/init.d/cookbooks
          test ! -e /usr/local/bin/app-restore
          test -d /var/lib/cookbooks
          ! wget -qO- http://127.0.0.1:8767/healthz >/dev/null 2>&1

  shellcheck:
    # POSIX sh, as BusyBox ash runs it on Alpine. `--shell=sh` makes bashisms an error.
    name: shellcheck (POSIX sh)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install shellcheck (pinned, so local runs agree)
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: shellcheck
        run: shellcheck --shell=sh installer/*.sh ops/* .github/scripts/*.sh

  ruff:
    # Errors only: syntax errors (E9) and pyflakes (F), set in ruff.toml. No formatter, no style rules.
    name: ruff (errors only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff (pinned, so local runs agree)
        run: python -m pip install ruff==0.17.4

      - name: ruff check
        run: ruff check --output-format=github .

  gitleaks:
    # The whole history on every run, not just the commits of a PR (the official action only scans the PR's range).
    # The release binary is pinned and checked against its SHA-256. Dependabot can't see this one: when you bump
    # the version, take the new checksum from that release's gitleaks_<version>_checksums.txt.
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout code (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit on every ref
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--all" .

  ui-tests:
    # The browser tests: test_ask_ui, test_ask_gate, test_frontend_errors and test_uid_route. They skip when Chromium
    # can't launch, so the script fails the job on any skip instead of letting it pass having tested nothing.
    name: UI tests (Playwright, Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ui.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-ui.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the UI tests (a skip fails the job)
        run: sh .github/scripts/run-ui-tests.sh

  upgrade-path:
    # Builds a database with the code from before uids, shelf locations and house recipes (b25b194), seeded from
    # seed.json, then starts the current code on it. See .github/scripts/upgrade_path.py for the assertions.
    name: upgrade path (old database, current code)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (all history, so the old commit exists)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Upgrade an old database
        run: python .github/scripts/upgrade_path.py

  seam-contract:
    # Dinner Log's cross-app contract tests (tests/contract/ in SDNick484/dinner-log), run against THIS checkout of
    # the catalog, the way dinner-log's own contract.yml runs them: both apps on loopback with fresh data and
    # generated tokens, wired together as docs/seam.md describes. Dinner Log's main is used as is, so a change
    # there can turn this job red without this PR being at fault.
    name: seam contract (with dinner-log main)
    runs-on: ubuntu-latest
    env:
      CI_STRICT: "1"   # dinner-log's tests/strict_skips.py: a skipped contract test fails the run

    steps:
      - name: Checkout cookbook-collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cookbook-collection
          persist-credentials: false

      - name: Checkout dinner-log (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SDNick484/dinner-log
          ref: main
          path: dinner-log
          persist-credentials: false

      - name: Show which dinner-log commit is tested
        run: git -C dinner-log log -1 --format='dinner-log main is %h (%cs) %s'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install each app in its own venv, from its own requirements
        run: |
          python -m venv "$RUNNER_TEMP/catalog-venv"
          "$RUNNER_TEMP/catalog-venv/bin/pip" install -q -r cookbook-collection/requirements-dev.txt
          python -m venv "$RUNNER_TEMP/dinner-venv"
          "$RUNNER_TEMP/dinner-venv/bin/pip" install -q -r dinner-log/requirements.txt pytest

      - name: Start both apps on loopback (fresh data, generated tokens)
        run: sh dinner-log/.github/scripts/start-seam.sh cookbook-collection "$RUNNER_TEMP/catalog-venv" "$RUNNER_TEMP/dinner-venv"

      - name: Contract tests
        working-directory: dinner-log
        run: '"$RUNNER_TEMP/dinner-venv/bin/python" -m pytest -q tests/contract'

      - name: Server logs
        if: failure()
        run: tail -n 60 "$SEAM_DIR/catalog.log" "$SEAM_DIR/dinner.log"
